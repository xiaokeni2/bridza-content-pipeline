</style></head><body class="iso" data-theme="dark"><main class="iso-page"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">AGV QR Navigation</span><span class="iso-plate-corner" data-corner="hint">Hover to drive the AGV</span><span class="iso-plate-corner" data-corner="readout" data-readout>Position error: 0.0mm · Heading error: 0.0° · Distance to next QR: 1500mm</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="AGV QR navigation simulator: arrow keys control the AGV" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div></div><figcaption class="iso-legend"><span class="iso-caption">How a QR-code-guided AGV navigates: onboard camera reads floor QR markers to correct position and heading</span></figcaption></figure></main><script type="module">
// Anatomy AGV QR Navigation Simulation
// Based on Anatomy framework patterns

// Camera projection constants
const AZIMUTH = 45;
const ELEVATION = 30;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);

function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
  const a = azimuth * RADIANS;
  const e = elevation * RADIANS;
  return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}

function iso([x, y, z], projection) {
  const { origin } = projection;
  const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
  return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}

function towardViewer(projection) {
  const { sinA, cosA } = cameraOf(projection);
  return [cosA, sinA];
}

function depthOf([x, y, z], projection) {
  const { sinA, cosA, sinE, cosE } = cameraOf(projection);
  return (x * cosA + y * sinA) * cosE + z * sinE;
}

function pathOf(points, closed = false) {
  if (!points.length) return "";
  return points.map(([x, y], at) => `${at ? "L" : "M"}${Math.round(x * 10) / 10} ${Math.round(y * 10) / 10}`).join("") + (closed ? "Z" : "");
}

function joinPaths(paths) {
  return paths.filter(Boolean).join("");
}

function roundedPlan({ x, y, w, d, r }, steps = 8) {
  const radius = Math.max(0, Math.min(r, w / 2, d / 2));
  const corners = [
    [x + w - radius, y + radius, -90],
    [x + w - radius, y + d - radius, 0],
    [x + radius, y + d - radius, 90],
    [x + radius, y + radius, 180],
  ];
  const out = [];
  for (const [cx, cy, start] of corners) {
    const count = radius > 0 ? steps : 0;
    for (let step = 0; step <= count; step++) {
      const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
      out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
    }
  }
  return out;
}

function slabOf(plan, z, height, projection, steps = 8, bevel = 0) {
  const ring = roundedPlan(plan, steps);
  const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
  const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
  
  // Calculate facing for shading
  const [vx, vy] = towardViewer(projection);
  const facing = ring.map(([ax, ay], index) => {
    const [bx, by] = ring[(index + 1) % ring.length];
    const dx = bx - ax;
    const dy = by - ay;
    const length = Math.hypot(dx, dy) || 1;
    const nx = dy / length;
    const ny = -dx / length;
    return nx * vx + ny * vy > 1e-9;
  });
  
  // Build fill path
  let fill = pathOf(top.concat(bottom.reverse()), true);
  
  // Build outline
  let outline = pathOf(top, true) + pathOf(bottom, true);
  
  // Build side faces
  for (let i = 0; i < ring.length; i++) {
    const next = (i + 1) % ring.length;
    if (facing[i]) {
      outline += pathOf([top[i], top[next], bottom[next], bottom[i]], true);
    }
  }
  
  return {
    fill,
    outline,
    top: pathOf(top, true),
    shades: ["", "", "", ""]
  };
}

function cylinder(cx, cy, radius, z, height, projection, steps = 32, bevel = 0) {
  const ring = Array.from({ length: steps }, (_, step) => {
    const angle = (step / steps) * Math.PI * 2;
    return [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
  });
  
  const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
  const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
  
  // Calculate facing
  const [vx, vy] = towardViewer(projection);
  const facing = ring.map(([ax, ay], index) => {
    const [bx, by] = ring[(index + 1) % ring.length];
    const dx = bx - ax;
    const dy = by - ay;
    const length = Math.hypot(dx, dy) || 1;
    const nx = dy / length;
    const ny = -dx / length;
    return nx * vx + ny * vy > 1e-9;
  });
  
  // Build fill
  let fill = pathOf(top, true) + pathOf(bottom, true);
  
  // Build side faces
  for (let i = 0; i < ring.length; i++) {
    const next = (i + 1) % ring.length;
    if (facing[i]) {
      fill += pathOf([top[i], top[next], bottom[next], bottom[i]], true);
    }
  }
  
  return {
    fill,
    outline: pathOf(top, true) + pathOf(bottom, true),
    top: pathOf(top, true),
    shades: ["", "", "", ""]
  };
}

function planOutline(plan, z, projection, steps = 8) {
  const ring = roundedPlan(plan, steps);
  return pathOf(ring.map(([x, y]) => iso([x, y, z], projection)), true);
}

function lineOnTop(from, to, z, projection) {
  return pathOf([iso(from, projection), iso(to, projection)]);
}

function translateAlong(projection, by) {
  const [x, y] = [by[0], by[1]];
  const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
  const tx = (x * sinA - y * cosA) * k;
  const ty = ((x * cosA + y * sinA) * sinE) * k;
  return `translate(${Math.round(tx * 100) / 100} ${Math.round(ty * 100) / 100})`;
}

function fitProjection(points, width, height, { pad = 24, headroom = 0, azimuth = AZIMUTH, elevation = ELEVATION } = {}) {
  const unit = { origin: [0, 0], scale: 1, azimuth, elevation };
  const flat = points.map((point) => iso(point, unit));
  const xs = flat.map(([x]) => x);
  const ys = flat.map(([, y]) => y);
  const left = Math.min(...xs);
  const right = Math.max(...xs);
  const up = Math.min(...ys);
  const down = Math.max(...ys);
  const scale = Math.min((width - pad * 2) / (right - left), (height - pad * 2 - headroom) / (down - up));
  return {
    origin: [width / 2 - ((left + right) / 2) * scale, headroom + (height - headroom) / 2 - ((up + down) / 2) * scale],
    scale,
    azimuth,
    elevation,
  };
}

function solidSvg(paths, { tone = "hi", crease = "faint", halo = false, lit = false, flat = false, className } = {}) {
  const parts = [];
  if (halo) parts.push(`<path class="iso-halo" d="${paths.fill}"/>`);
  parts.push(`<path class="iso-fill" d="${paths.fill}"/>`);
  if (!flat) {
    parts.push(`<path class="iso-top" d="${paths.top}"/>`);
  }
  if (crease !== "none") {
    parts.push(`<path class="iso-line iso-crease" data-tone="${crease}" d="${paths.outline}"/>`);
  }
  parts.push(`<path class="iso-line iso-edge" data-tone="${tone}" d="${paths.outline}"/>`);
  return `<g class="iso-solid${className ? ` ${className}` : ""}"${lit ? " data-lit" : ""}>${parts.join("")}</g>`;
}

function lineSvg(d, { tone = "lo", dotted = false, dashed = false, flow = false, className, free } = {}) {
  if (!d) return "";
  return `<path class="iso-line${className ? ` ${className}` : ""}" data-tone="${tone}"${dotted ? " data-dotted" : ""}${dashed ? " data-dashed" : ""}${flow ? " data-flow" : ""}${free ? ` data-free="${free}"` : ""} d="${d}"/>`;
}

function dotsSvg(points, { size = 0.5, tone = "mid", pulse = false } = {}) {
  const dots = points
    .map(([x, y], index) => `<circle cx="${Math.round(x * 10) / 10}" cy="${Math.round(y * 10) / 10}" r="${size}"${pulse ? ` data-pulse="" style="--pulse-at:${(index * 137) % 1600}ms"` : ""}/>`) 
    .join("");
  return `<g class="iso-dots" data-tone="${tone}">${dots}</g>`;
}

function faceTextSvg(transform, text, { size = 3, tone = "mid", anchor = "start" } = {}) {
  return `<text class="iso-face-text" data-tone="${tone}" transform="${transform}" font-size="${size}" text-anchor="${anchor}">${text}</text>`;
}

function figureSvg({ width, height, label, body, standalone = false, className }) {
  return `<svg xmlns="http://www.w3.org/2000/svg" class="iso-svg${standalone ? " iso" : ""}${className ? ` ${className}` : ""}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${label}">${Array.isArray(body) ? body.join("") : body}</svg>`;
}

function plateHtml({ fig, title, hint, readout = "", keys = [], caption }) {
  const corner = (name, text, extra = "") => `<span class="iso-plate-corner" data-corner="${name}"${extra}>${text}</span>`;
  const legend = keys.length || caption
    ? `<figcaption class="iso-legend">${keys.length ? `<span class="iso-keys">${keys.map((key) => `<span class="iso-key">${key.label}</span>`).join("")}</span>` : ""}${caption ? `<span class="iso-caption">${caption}</span>` : ""}</figcaption>`
    : "";
  return `<figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true">${corner("fig", fig)}${title ? corner("title", title) : ""}${hint ? corner("hint", hint) : ""}${corner("readout", readout, " data-readout")}</div><div class="iso-stage" tabindex="0" role="slider" aria-label="AGV QR navigation simulator: arrow keys control the AGV" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div></div>${legend}</figure>`;
}

// Simulation model for AGV QR navigation
// Realistic odometry + QR correction model
class AGVSimulator {
  constructor() {
    // AGV physical parameters
    this.width = 400; // mm
    this.length = 600; // mm
    this.height = 250; // mm
    this.wheelBase = 450; // mm
    
    // Camera parameters
    this.cameraHeight = 400; // mm above ground
    this.cameraFOV = 60; // degrees
    
    // Path parameters
    this.pathPoints = [
      [-2000, 0], [-1500, 0], [-1000, 0], [-500, 0], [0, 0], 
      [500, 0], [1000, 0], [1500, 0], [2000, 0]
    ];
    
    // QR marker positions (on floor)
    this.qrMarkers = [
      { x: -1500, y: 0, id: "QR-001" },
      { x: -500, y: 0, id: "QR-002" },
      { x: 500, y: 0, id: "QR-003" },
      { x: 1500, y: 0, id: "QR-004" }
    ];
    
    // Initial state
    this.position = { x: -1800, y: 0, z: 0 }; // mm
    this.heading = 0; // radians
    this.odometryX = 0;
    this.odometryY = 0;
    this.odometryHeading = 0;
    
    // Simulation state
    this.time = 0;
    this.speed = 0; // mm/s
    this.targetSpeed = 0;
    this.steering = 0; // radians
    this.targetSteering = 0;
    
    // QR reading state
    this.lastQRRead = null;
    this.qrReadTime = 0;
    this.qrReading = false;
    
    // Error states
    this.positionError = 0; // mm
    this.headingError = 0; // radians
    this.distanceToNextQR = 1500; // mm
  }
  
  update(dt) {
    this.time += dt;
    
    // Smooth speed and steering control
    this.speed += (this.targetSpeed - this.speed) * 0.1;
    this.steering += (this.targetSteering - this.steering) * 0.1;
    
    // Odometry integration (simplified)
    const forward = this.speed * dt;
    const lateral = 0; // No lateral slip in this model
    
    // Update odometry position
    this.odometryX += forward * Math.cos(this.odometryHeading);
    this.odometryY += forward * Math.sin(this.odometryHeading);
    this.odometryHeading += this.steering * dt * 0.5;
    
    // Apply wheel base effect on heading
    this.odometryHeading += (this.steering * dt * 0.5) * (this.wheelBase / 1000);
    
    // Update true position (with drift)
    this.position.x += forward * Math.cos(this.heading) * 0.99;
    this.position.y += forward * Math.sin(this.heading) * 0.99;
    this.heading += this.steering * dt * 0.4;
    
    // Calculate errors
    const dx = this.position.x - this.odometryX;
    const dy = this.position.y - this.odometryY;
    this.positionError = Math.sqrt(dx*dx + dy*dy);
    
    // Heading error
    this.headingError = Math.abs(this.heading - this.odometryHeading);
    
    // Find distance to next QR marker
    let minDistance = Infinity;
    let nextQR = null;
    for (const qr of this.qrMarkers) {
      const distance = Math.sqrt(Math.pow(qr.x - this.position.x, 2) + Math.pow(qr.y - this.position.y, 2));
      if (distance < minDistance && distance > 100) { // Don't count very close ones
        minDistance = distance;
        nextQR = qr;
      }
    }
    this.distanceToNextQR = minDistance;
    
    // Simulate QR reading when close enough
    if (nextQR && minDistance < 300) {
      this.qrReading = true;
      this.qrReadTime = this.time;
      
      // Hard reset position and heading when reading QR
      if (minDistance < 150 && this.time - this.qrReadTime > 0.1) {
        this.position.x = nextQR.x;
        this.position.y = nextQR.y;
        this.position.z = 0;
        this.heading = 0; // Reset to path heading
        
        // Reset odometry to match
        this.odometryX = this.position.x;
        this.odometryY = this.position.y;
        this.odometryHeading = this.heading;
        
        // Reset errors
        this.positionError = 0;
        this.headingError = 0;
        
        this.lastQRRead = nextQR.id;
      }
    } else {
      this.qrReading = false;
    }
    
    // Return current state
    return {
      position: { ...this.position },
      heading: this.heading,
      odometry: { x: this.odometryX, y: this.odometryY, heading: this.odometryHeading },
      positionError: this.positionError,
      headingError: this.headingError,
      distanceToNextQR: this.distanceToNextQR,
      lastQRRead: this.lastQRRead,
      qrReading: this.qrReading
    };
  }
  
  setTargetSpeed(speed) {
    this.targetSpeed = speed;
  }
  
  setTargetSteering(steering) {
    this.targetSteering = steering;
  }
}

// Build the AGV diagram
function buildAGVDiagram() {
  // Define dimensions and projection
  const WIDTH = 800;
  const HEIGHT = 500;
  
  // World coordinates for AGV and environment
  const AGV = {
    x: 0, y: 0, z: 0, // Base position
    width: 400, length: 600, height: 250,
    wheelBase: 450,
    cameraHeight: 400
  };
  
  const PATH = {
    x: -2000, y: 0, w: 4000, d: 200, r: 0
  };
  
  const QR_MARKER = {
    x: 0, y: 0, w: 150, d: 150, r: 0
  };
  
  // Fit projection to contain all elements
  const points = [
    // AGV bounding box
    [AGV.x - AGV.length/2, AGV.y - AGV.width/2, 0],
    [AGV.x + AGV.length/2, AGV.y + AGV.width/2, AGV.height],
    // Path
    [PATH.x, PATH.y - PATH.d/2, 0],
    [PATH.x + PATH.w, PATH.y + PATH.d/2, 0],
    // QR markers
    [0, 0, 0], [1500, 0, 0], [-1500, 0, 0]
  ];
  
  const P = fitProjection(points, WIDTH, HEIGHT, { pad: 40, azimuth: 42 });
  
  // Helper functions
  const at = (point) => iso(point, P);
  const S = (paths, style) => solidSvg(paths, style);
  const L = (d, style) => lineSvg(d, style);
  
  // Build path (floor)
  function path() {
    const out = [];
    // Floor slab
    const floor = { x: PATH.x, y: PATH.y, w: PATH.w, d: PATH.d, r: 0 };
    out.push(S(slabOf(floor, -10, 5, P, 8), { tone: "lo" }));
    
    // Path center line
    const centerLine = lineOnTop([PATH.x, PATH.y], [PATH.x + PATH.w, PATH.y], -5, P);
    out.push(L(centerLine, { tone: "faint", dashed: true }));
    
    // Path edge lines
    const edge1 = lineOnTop([PATH.x, PATH.y - PATH.d/2], [PATH.x + PATH.w, PATH.y - PATH.d/2], -5, P);
    const edge2 = lineOnTop([PATH.x, PATH.y + PATH.d/2], [PATH.x + PATH.w, PATH.y + PATH.d/2], -5, P);
    out.push(L(edge1, { tone: "mid" }));
    out.push(L(edge2, { tone: "mid" }));
    
    return out.join("");
  }
  
  // Build QR marker
  function qrMarker(x, y, id) {
    const out = [];
    const qr = { x, y, w: 150, d: 150, r: 0 };
    
    // QR marker slab
    out.push(S(slabOf(qr, -5, 2, P, 4), { tone: "mid" }));
    
    // QR pattern (simplified as grid)
    const gridSize = 15;
    const rows = 10;
    const cols = 10;
    
    for (let i = 0; i < rows; i++) {
      for (let j = 0; j < cols; j++) {
        if ((i + j) % 2 === 0) {
          const cell = { x: x + j * gridSize, y: y + i * gridSize, w: gridSize, d: gridSize, r: 0 };
          out.push(S(slabOf(cell, -3, 1, P, 2), { tone: "hi" }));
        }
      }
    }
    
    // QR ID text
    const textPos = at([x, y + 80, -2]);
    out.push(`<text class="iso-face-text" data-tone="lit" x="${textPos[0]}" y="${textPos[1]}" font-size="8" text-anchor="middle" dominant-baseline="middle">${id}</text>`);
    
    return out.join("");
  }
  
  // Build AGV vehicle
  function agv() {
    const out = [];
    
    // AGV chassis
    const chassis = { x: 0, y: 0, w: AGV.width, d: AGV.length, r: 10 };
    out.push(S(slabOf(chassis, 0, 30, P, 8), { tone: "mid" }));
    
    // AGV wheels
    const wheelRadius = 80;
    const wheelOffset = 150;
    
    // Front left wheel
    out.push(S(cylinder(-wheelOffset, -AGV.width/2, wheelRadius, 0, 20, P, 24), { tone: "lo" }));
    // Front right wheel
    out.push(S(cylinder(-wheelOffset, AGV.width/2, wheelRadius, 0, 20, P, 24), { tone: "lo" }));
    // Rear left wheel
    out.push(S(cylinder(wheelOffset, -AGV.width/2, wheelRadius, 0, 20, P, 24), { tone: "lo" }));
    // Rear right wheel
    out.push(S(cylinder(wheelOffset, AGV.width/2, wheelRadius, 0, 20, P, 24), { tone: "lo" }));
    
    // AGV body
    const body = { x: -100, y: -AGV.width/2 + 20, w: 200, d: AGV.length - 40, r: 5 };
    out.push(S(slabOf(body, 30, 150, P, 8), { tone: "mid" }));
    
    // Camera mast
    const mastHeight = 100;
    const mast = { x: 0, y: 0, w: 20, d: 20, r: 0 };
    out.push(S(slabOf(mast, 150, mastHeight, P, 4), { tone: "mid" }));
    
    // Camera housing
    const camera = { x: 0, y: 0, w: 60, d: 60, r: 5 };
    out.push(S(slabOf(camera, 150 + mastHeight, 40, P, 8), { tone: "hi" }));
    
    // Camera lens
    out.push(S(cylinder(0, 0, 15, 150 + mastHeight + 40, 10, P, 16), { tone: "lit", lit: true }));
    
    // Camera field of view indicator
    const fovAngle = 60 * Math.PI / 180;
    const fovLength = 400;
    const leftFov = [
      at([0, 0, 150 + mastHeight + 40]),
      at([fovLength * Math.sin(-fovAngle/2), fovLength * Math.cos(-fovAngle/2), 150 + mastHeight + 40]),
      at([fovLength * Math.sin(fovAngle/2), fovLength * Math.cos(fovAngle/2), 150 + mastHeight + 40])
    ];
    out.push(L(pathOf(leftFov), { tone: "faint", dotted: true }));
    
    // Steering linkage
    const steeringLink = { x: -100, y: -AGV.width/2 + 10, w: 100, d: 20, r: 0 };
    out.push(S(slabOf(steeringLink, 0, 10, P, 4), { tone: "mid" }));
    
    // Heading indicator arrow
    const arrowLength = 100;
    const arrowHead = [
      at([0, 0, 150]),
      at([arrowLength * Math.sin(0), arrowLength * Math.cos(0), 150]),
      at([arrowLength * Math.sin(0) - 20 * Math.sin(0 + Math.PI/3), arrowLength * Math.cos(0) - 20 * Math.cos(0 + Math.PI/3), 150]),
      at([arrowLength * Math.sin(0), arrowLength * Math.cos(0), 150]),
      at([arrowLength * Math.sin(0) - 20 * Math.sin(0 - Math.PI/3), arrowLength * Math.cos(0) - 20 * Math.cos(0 - Math.PI/3), 150])
    ];
    out.push(L(pathOf(arrowHead, true), { tone: "lit" }));
    
    return out.join("");
  }
  
  // Build error indicators
  function errorIndicators() {
    const out = [];
    
    // Position error indicator
    const posError = { x: -250, y: -150, w: 100, d: 100, r: 5 };
    out.push(S(slabOf(posError, 0, 20, P, 4), { tone: "red" }));
    out.push(`<text class="iso-face-text" data-tone="red" x="${at([-250, -150, 20])[0]}" y="${at([-250, -150, 20])[1]}" font-size="10" text-anchor="middle" dominant-baseline="middle">ΔX</text>`);
    
    // Heading error indicator
    const headError = { x: -250, y: -50, w: 100, d: 100, r: 5 };
    out.push(S(slabOf(headError, 0, 20, P, 4), { tone: "blue" }));
    out.push(`<text class="iso-face-text" data-tone="blue" x="${at([-250, -50, 20])[0]}" y="${at([-250, -50, 20])[1]}" font-size="10" text-anchor="middle" dominant-baseline="middle">Δθ</text>`);
    
    // Distance indicator
    const distIndicator = { x: -250, y: 50, w: 100, d: 100, r: 5 };
    out.push(S(slabOf(distIndicator, 0, 20, P, 4), { tone: "green" }));
    out.push(`<text class="iso-face-text" data-tone="green" x="${at([-250, 50, 20])[0]}" y="${at([-250, 50, 20])[1]}" font-size="10" text-anchor="middle" dominant-baseline="middle">D</text>`);
    
    return out.join("");
  }
  
  // Build legend
  function legend() {
    const out = [];
    
    // Legend items
    out.push(`<g class="iso-legend-item" transform="translate(20, ${HEIGHT - 120})">`);
    out.push(`<rect x="0" y="0" width="12" height="12" fill="var(--anatomy-red)"/>`);
    out.push(`<text class="iso-face-text" data-tone="red" x="20" y="10" font-size="10">Position error</text>`);
    out.push(`</g>`);
    
    out.push(`<g class="iso-legend-item" transform="translate(20, ${HEIGHT - 90})">`);
    out.push(`<rect x="0" y="0" width="12" height="12" fill="var(--anatomy-blue)"/>`);
    out.push(`<text class="iso-face-text" data-tone="blue" x="20" y="10" font-size="10">Heading error</text>`);
    out.push(`</g>`);
    
    out.push(`<g class="iso-legend-item" transform="translate(20, ${HEIGHT - 60})">`);
    out.push(`<rect x="0" y="0" width="12" height="12" fill="var(--anatomy-green)"/>`);
    out.push(`<text class="iso-face-text" data-tone="green" x="20" y="10" font-size="10">Distance to QR</text>`);
    out.push(`</g>`);
    
    return out.join("");
  }
  
  // Assemble the SVG
  const svgContent = [
    path(),
    `<g data-part="qr-markers">${qrMarker(-1500, 0, "QR-001")}${qrMarker(-500, 0, "QR-002")}${qrMarker(500, 0, "QR-003")}${qrMarker(1500, 0, "QR-004")}</g>`,
    `<g data-part="agv" transform="${translateAlong(P, [0, 0, 0])}">${agv()}</g>`,
    errorIndicators(),
    legend()
  ].join("");
  
  return figureSvg({
    width: WIDTH,
    height: HEIGHT,
    label: "AGV QR Navigation Simulation",
    body: svgContent
  });
}

// Initialize simulation
const simulator = new AGVSimulator();
const svg = buildAGVDiagram();

// Set up the DOM
const stage = document.querySelector(".iso-stage");
stage.innerHTML = svg;

// Get references to SVG elements
const agvElement = stage.querySelector('[data-part="agv"]');
const qrElements = stage.querySelectorAll('[data-part="qr-markers"] > g');
const readout = document.querySelector("[data-readout]");

// Animation loop
let lastTime = 0;
let frame = 0;
let visible = true;

function tick(now) {
  const dt = lastTime ? Math.min((now - lastTime) / 1000, 1 / 30) : 1 / 60;
  lastTime = now;
  
  // Update simulation
  const state = simulator.update(dt);
  
  // Update AGV position
  const transform = translateAlong({
    origin: [0, 0],
    scale: 1,
    azimuth: 42,
    elevation: 30
  }, [state.position.x / 10, state.position.y / 10, 0]);
  
  if (agvElement) {
    agvElement.setAttribute("transform", transform);
  }
  
  // Update readout
  const positionError = state.positionError.toFixed(1);
  const headingError = (state.headingError * 180 / Math.PI).toFixed(1);
  const distanceToNextQR = Math.round(state.distanceToNextQR);
  
  const text = `Position error: ${positionError}mm · Heading error: ${headingError}° · Distance to next QR: ${distanceToNextQR}mm`;
  if (readout.textContent !== text) {
    readout.textContent = text;
  }
  
  // Update QR reading visual feedback
  if (state.qrReading) {
    // Make QR markers glow when being read
    qrElements.forEach(el => {
      el.style.filter = "drop-shadow(0 0 10px rgba(255,255,255,0.5))";
    });
  } else {
    qrElements.forEach(el => {
      el.style.filter = "none";
    });
  }
  
  // Continue animation
  if (visible) {
    frame = requestAnimationFrame(tick);
  }
}

// Handle user input
function handlePointerMove(event) {
  const rect = stage.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  
  // Map horizontal position to speed control
  const speedShare = Math.max(0, Math.min(1, (x / rect.width) - 0.25) / 0.5);
  simulator.setTargetSpeed(speedShare * 300); // 0-300 mm/s
  
  // Map vertical position to steering control
  const steeringShare = Math.max(-1, Math.min(1, (y / rect.height) - 0.5) * 2);
  simulator.setTargetSteering(steeringShare * 0.1); // -0.1 to 0.1 rad
}

// Keyboard controls
function handleKeyDown(event) {
  switch (event.key) {
    case "ArrowUp":
      simulator.setTargetSpeed(Math.min(300, simulator.targetSpeed + 50));
      break;
    case "ArrowDown":
      simulator.setTargetSpeed(Math.max(0, simulator.targetSpeed - 50));
      break;
    case "ArrowLeft":
      simulator.setTargetSteering(Math.max(-0.15, simulator.targetSteering - 0.02));
      break;
    case "ArrowRight":
      simulator.setTargetSteering(Math.min(0.15, simulator.targetSteering + 0.02));
      break;
    case " ": // Space bar
      simulator.setTargetSpeed(0);
      simulator.setTargetSteering(0);
      break;
  }
}

// Initialize
stage.addEventListener("pointermove", handlePointerMove);
stage.addEventListener("keydown", handleKeyDown);
stage.addEventListener("focus", () => { stage.setAttribute("tabindex", "0"); });

// Start animation
tick(performance.now());

// Accessibility
stage.setAttribute("aria-label", "AGV QR navigation simulator: hover to drive the AGV, arrow keys to control speed and steering");
stage.setAttribute("role", "application");
</script></body></html>
